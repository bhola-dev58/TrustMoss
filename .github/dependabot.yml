# ─────────────────────────────────────────────────────────────────────────────
# .github/dependabot.yml — TrustMoss Automated Dependency Updates
#
# Dependabot raises Pull Requests when dependencies have:
#   - Security patches (always prioritised)
#   - Minor/patch version updates (grouped to reduce PR noise)
#
# Ecosystems covered:
#   1. pip        → apps/api/requirements.txt + requirements-dev.txt
#   2. npm        → apps/web/package.json
#   3. docker     → services/Dockerfile + apps/web/Dockerfile (base image updates)
#   4. github-actions → .github/workflows/*.yml (actions version pins)
# ─────────────────────────────────────────────────────────────────────────────

version: 2

updates:

  # ── 1. Python (pip) — Backend API & microservices ───────────────────────
  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "security"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Group all minor + patch updates into a single PR to reduce noise.
    # Security updates are always opened individually (Dependabot default).
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pin major version jumps for manual review — breaking changes likely
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "groq"
        update-types: ["version-update:semver-major"]

  # ── 2. Node.js (npm) — Next.js 14 Web UI ─────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
      - "frontend"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Next.js major version bumps require manual migration
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # ── 3. Docker — Base image updates (python-slim, node-alpine) ────────────
  - package-ecosystem: "docker"
    directory: "/services"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
      - "infrastructure"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:30"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "docker"
      - "frontend"
    commit-message:
      prefix: "build"
      include: "scope"

  # ── 4. GitHub Actions — Workflow action version pins ─────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      # Group all action updates into one PR per week
      github-actions-all:
        update-types:
          - "minor"
          - "patch"
