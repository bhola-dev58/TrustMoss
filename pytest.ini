# ─────────────────────────────────────────────────────────────────────────────
# pytest.ini — TrustMoss Test Runner Configuration
#
# Run from project root:  pytest apps/api/tests/ -v
# ─────────────────────────────────────────────────────────────────────────────

[pytest]
# Test discovery paths
testpaths = apps/api/tests

# Display options
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# Allow asyncio tests (for future async test expansion)
asyncio_mode = auto

# Minimum coverage threshold (also enforced in CI with --cov-fail-under)
# This file sets the project-wide default; CI overrides with command-line flag.

# Custom markers
markers =
    unit: Pure unit tests (no external dependencies)
    integration: Integration tests (may need service stubs)
    slow: Tests that take > 1s to complete
    security: Security-focused test cases (OWASP, GDPR)
