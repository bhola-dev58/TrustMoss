[project]
name = "trustmoss"
version = "0.1.0"
description = "TrustMoss: Real-Time Trust, Verification, and Policy Gate for Autonomous Multi-Agent Voice Systems"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "TrustMoss Core Team" }
]
dependencies = [
    "fastapi>=0.115.11",
    "uvicorn[standard]>=0.30.6",
    "python-dotenv>=1.2.2",
    "httpx>=0.27.2",
    "groq>=0.11.0",
    "moss>=1.9.1",
    "pydantic>=2.9.2",
    "livekit-api>=1.2.0",
    "pyjwt>=2.14.0",
    "cryptography>=43.0.0",
    "hvac>=2.3.0",
    "asyncpg>=0.29.0",
    "redis>=5.0.0",
    "alembic>=1.13.0",
    "sqlalchemy>=2.0.0",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = ">=0.6.9"
bandit = ">=1.7.10"
pip-audit = ">=2.7.3"

[tool.poetry.group.test.dependencies]
pytest = ">=9.1.1"
pytest-cov = ">=6.0.0"
pytest-asyncio = ">=0.24.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
